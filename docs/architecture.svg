<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title description">
  <title id="title">Gitsnap architecture</title>
  <desc id="description">Gitsnap reads Git metadata, masks sensitive values, formats Markdown or JSON, and can upload the snapshot to a local Express API backed by a JSON file.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526579"/>
    </marker>
    <style>
      .bg { fill: #f4f7f8; }
      .node { fill: #ffffff; stroke: #c9d5dc; stroke-width: 2; }
      .core { fill: #e8f4f1; stroke: #1d806e; stroke-width: 2; }
      .store { fill: #fff3e5; stroke: #c87424; stroke-width: 2; }
      .line { fill: none; stroke: #526579; stroke-width: 3; marker-end: url(#arrow); }
      .title { font: 700 20px sans-serif; fill: #183143; }
      .label { font: 600 16px sans-serif; fill: #183143; }
      .small { font: 14px sans-serif; fill: #526579; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="300" rx="18"/>
  <text class="title" x="40" y="42">A small, local-first snapshot pipeline</text>
  <rect class="node" x="40" y="105" width="190" height="105" rx="12"/>
  <text class="label" x="135" y="145" text-anchor="middle">Git repository</text>
  <text class="small" x="135" y="173" text-anchor="middle">branch / status / diff / log</text>
  <rect class="core" x="300" y="105" width="190" height="105" rx="12"/>
  <text class="label" x="395" y="145" text-anchor="middle">Gitsnap CLI</text>
  <text class="small" x="395" y="173" text-anchor="middle">Node.js 18+ / CommonJS</text>
  <rect class="core" x="560" y="105" width="190" height="105" rx="12"/>
  <text class="label" x="655" y="145" text-anchor="middle">Secret masking</text>
  <text class="small" x="655" y="173" text-anchor="middle">enabled by default</text>
  <rect class="node" x="820" y="70" width="250" height="78" rx="12"/>
  <text class="label" x="945" y="103" text-anchor="middle">Markdown or JSON</text>
  <text class="small" x="945" y="128" text-anchor="middle">standard output</text>
  <rect class="store" x="820" y="172" width="250" height="78" rx="12"/>
  <text class="label" x="945" y="205" text-anchor="middle">Optional Express API</text>
  <text class="small" x="945" y="230" text-anchor="middle">snapshots.json file store</text>
  <path class="line" d="M230 157H292"/>
  <path class="line" d="M490 157H552"/>
  <path class="line" d="M750 135H812"/>
  <path class="line" d="M750 180C780 180 785 211 812 211"/>
</svg>
